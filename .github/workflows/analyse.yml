name: Analyse collected data

# ---------------------------------------------------------------------------
# Runs the whole pipeline on whatever has been collected so far:
#   02_derive_flows      - differences the stock series into flows
#   03_fetch_meteoswiss  - downloads hourly weather for the nearest station
#   04_join_and_analyse  - joins the two sources and reports the relationship
#
# 02_derive_flows also reports the collection diagnostics that used to live in
# this file as an inline script: how often the feed publishes, how much of the
# network is reporting, how many duplicate or stale-replica rows were dropped,
# and how much of the window the collector was actually polling. It can do that
# better than a workflow step, because it reads data/poll_log/ - which records
# every poll attempt, not only the ones that produced data.
#
# Run it from Actions > "Analyse collected data" > Run workflow.
# Results appear in the job summary AND are committed to derived/.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      shift_weather:
        description: 'Shift weather forward by N hours (MeteoSwiss hours look backward)'
        required: false
        default: '0'
      station_abbr:
        description: 'Force a MeteoSwiss station (e.g. BER). Blank = nearest to the bike centroid.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: jsonlite

      - name: Derive flows
        run: |
          set -o pipefail
          Rscript R/02_derive_flows.R --data data --out derived 2>&1 | tee /tmp/derive.log

      - name: Fetch MeteoSwiss weather
        run: |
          set -o pipefail
          echo "--- nearest weather stations ---"
          Rscript R/03_fetch_meteoswiss.R --stations derived/stations.csv --list || true
          echo "--- downloading ---"
          ABBR="${{ github.event.inputs.station_abbr }}"
          if [ -n "$ABBR" ]; then
            Rscript R/03_fetch_meteoswiss.R --stations derived/stations.csv \
              --station-abbr "$ABBR" --out derived 2>&1 | tee /tmp/weather.log
          else
            Rscript R/03_fetch_meteoswiss.R --stations derived/stations.csv \
              --out derived 2>&1 | tee /tmp/weather.log
          fi

      - name: Join and analyse
        run: |
          set -o pipefail
          Rscript R/04_join_and_analyse.R --derived derived \
            --shift-weather "${{ github.event.inputs.shift_weather || '0' }}" 2>&1 | tee /tmp/join.log

      - name: Summarise outputs
        if: always()
        run: |
          echo "--- derived files ---"
          ls -la derived/ 2>/dev/null || echo "none"

      - name: Commit derived tables
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f derived/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "analysis: derived tables $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}" || true
            git rebase "origin/${{ github.ref_name }}" || git rebase --abort || true
            if git push origin HEAD:"${{ github.ref_name }}"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in 15s."
            sleep 15
          done
          echo "::error::Could not push the derived tables after 5 attempts."
          exit 1

      # The health check you want to read daily, without opening step logs.
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Pipeline run"
            for f in derive weather join; do
              if [ -f "/tmp/$f.log" ]; then
                echo ""
                echo "### $f"
                echo '```'
                tail -60 "/tmp/$f.log"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
