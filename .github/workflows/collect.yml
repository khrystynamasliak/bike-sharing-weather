name: Collect PubliBike data

# ---------------------------------------------------------------------------
# WHY THIS IS STRUCTURED THIS WAY
#
# The obvious approach - `cron: '*/5 * * * *'` - does not work. GitHub's
# scheduled triggers are best-effort and heavily delayed under load; people who
# monitor it have measured */5 jobs firing around 5% of their slots. That would
# destroy the sampling structure this project depends on.
#
# Instead this runs ONE LONG JOB that polls internally every minute for 5h30m,
# then commits its data and dispatches the next run. GitHub-hosted jobs are
# killed at 6 hours, so we exit before that. A cron entry every 6 hours acts
# only as a watchdog in case the chain breaks.
#
# SETUP (three things, all required):
#
#  1. The repository must be PUBLIC. Public repos get unlimited Actions
#     minutes; the free private-repo allowance of 2,000 minutes/month would be
#     exhausted in about three days by this workflow.
#
#  2. Settings > Actions > General > Workflow permissions:
#     select "Read and write permissions" so the job can commit data back.
#
#  3. Create a fine-grained Personal Access Token with "Actions: read and
#     write" and "Contents: read and write" on this repo, and save it as a
#     repository secret named COLLECTOR_PAT.
#     This is needed because a workflow_dispatch triggered by the default
#     GITHUB_TOKEN does NOT start a new workflow run - GitHub blocks that to
#     prevent runaway recursion. Without the PAT the chain stops after one run.
#
# TO START: go to Actions > "Collect PubliBike data" > Run workflow.
# TO STOP:  Actions > the workflow > "..." > Disable workflow.
#           Do this when you have enough data. It will otherwise run forever.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'City filter (leave BLANK for the whole country)'
        required: false
        default: ''
      interval:
        description: 'Seconds between polls'
        required: false
        default: '60'
      duration:
        description: 'Minutes to collect. Use 2 for a quick test, 320 for a real run.'
        required: false
        default: '320'
      feed:
        description: 'GBFS feed. Velospot is the live PubliBike network since the merger.'
        required: false
        default: 'https://api.mobidata-bw.de/sharing/gbfs/v3/velospot_ch/gbfs'
        type: choice
        options:
          - 'https://api.mobidata-bw.de/sharing/gbfs/v3/velospot_ch/gbfs'
          - 'https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_ch/gbfs.json'
          - 'https://api.publibike.ch/v1/gbfs/v2/gbfs.json'
  schedule:
    # Watchdog only. Restarts the chain if a run failed and never dispatched
    # its successor. Deliberately at :17 rather than :00, since delays are
    # worst at the top of the hour.
    - cron: '17 */6 * * *'

# Never run two collectors at once - they would poll the same feed twice and
# double-count. A new run waits rather than overlapping.
concurrency:
  group: publibike-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355          # hard ceiling is 360; leave headroom

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true    # binary packages, installs in seconds

      - name: Install jsonlite
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: jsonlite

      - name: Collect
        env:
          CITY: ${{ github.event.inputs.city || '' }}
          INTERVAL: ${{ github.event.inputs.interval || '60' }}
          DURATION: ${{ github.event.inputs.duration || '320' }}
          FEED: ${{ github.event.inputs.feed || 'https://api.mobidata-bw.de/sharing/gbfs/v3/velospot_ch/gbfs' }}
        run: |
          TAG=$(date -u +%Y%m%dT%H%M%SZ)
          echo "Run tag: $TAG  city='$CITY'  interval=${INTERVAL}s  duration=${DURATION}min"
          echo "Feed: $FEED"
          ARGS="--interval $INTERVAL --duration $DURATION --tag $TAG --outdir data --feed $FEED"
          if [ -n "$CITY" ]; then ARGS="$ARGS --city $CITY"; fi
          Rscript R/01_collect_publibike.R $ARGS

      - name: Show what was collected
        if: always()
        run: |
          echo "--- files ---"
          ls -la data/station_status/ 2>/dev/null | tail -5 || echo "none"
          echo "--- total size ---"
          du -sh data/ 2>/dev/null || true

      # Committing runs even if collection failed partway, so a crashed job
      # still saves whatever it managed to gather.
      - name: Commit data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "data: collection run $(date -u +%Y-%m-%dT%H:%MZ)"
            # The repo may have moved on; rebase rather than fail.
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Dispatch the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COLLECTOR_PAT }}
        run: |
          DURATION="${{ github.event.inputs.duration || '320' }}"
          if [ "$DURATION" -lt 60 ]; then
            echo "Short test run (${DURATION} min) - not chaining. Re-run with"
            echo "duration 320 to start continuous collection."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::COLLECTOR_PAT is not set - the chain stops here."
            echo "Collection will only resume at the next 6-hourly watchdog,"
            echo "which may be delayed. See the setup notes at the top of this file."
            exit 0
          fi
          gh workflow run "${{ github.workflow }}" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f city="${{ github.event.inputs.city || '' }}" \
            -f interval="${{ github.event.inputs.interval || '60' }}" \
            -f duration="320" \
            -f feed="${{ github.event.inputs.feed || 'https://api.mobidata-bw.de/sharing/gbfs/v3/velospot_ch/gbfs' }}"
          echo "Next run dispatched."
